<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokemon Go IV Odds</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <h1>IV Chances</h1>
        </div>
      </header>

      <section class="pokemon-panel" aria-label="Pokémon CP settings">
        <div class="pokemon-search">
          <div class="combobox">
            <input
              id="pokemonSearch"
              type="search"
              role="combobox"
              placeholder="Select Pokémon by number or name"
              autocomplete="off"
              aria-label="Select Pokémon by number or name"
              aria-autocomplete="list"
              aria-controls="pokemonOptions"
              aria-expanded="false"
            >
            <div class="pokemon-options" id="pokemonOptions" role="listbox" hidden></div>
          </div>
          <small class="visually-hidden" id="pokemonSearchStatus" aria-live="polite">Loading Pokémon…</small>
        </div>

        <div class="level-settings" id="levelSettings" hidden>
          <label for="levelSlider">Level</label>
          <div class="level-inputs">
            <input id="levelSlider" type="range" min="1" max="50" step="0.5" value="20">
            <input id="levelInput" type="number" min="1" max="50" step="0.5" value="20" inputmode="decimal">
          </div>
          <div class="level-presets" aria-label="Common encounter levels">
            <button type="button" data-level="15">Research · 15</button>
            <button type="button" data-level="20">Raid / Egg · 20</button>
            <button type="button" data-level="25">Weather Raid · 25</button>
          </div>
        </div>
      </section>

      <section class="graph-panel" aria-label="IV percentage distribution">
        <div class="chart-frame">
          <canvas id="chart" aria-label="Graph of IV percentage relative frequencies"></canvas>
          <div class="threshold-control" id="thresholdControl" aria-label="Selected IV percentage">
            <button class="threshold-arrow" id="thresholdPrev" type="button" title="Previous IV percentage" aria-label="Previous IV percentage">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="m15 18-6-6 6-6"></path>
              </svg>
            </button>
            <span class="threshold-values">
              <output id="thresholdOutput">91%</output>
              <output class="cp-output" id="cpOutput" hidden></output>
            </span>
            <button class="threshold-arrow" id="thresholdNext" type="button" title="Next IV percentage" aria-label="Next IV percentage">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="m9 18 6-6-6-6"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="iv-selector">
          <button class="iv-toggle" id="ivToggle" type="button" aria-expanded="false" aria-controls="ivControls">
            <span class="iv-indicator" id="ivIndicator" aria-hidden="true">▸</span>
            <span>Individual IVs</span>
            <small id="ivSummary">14 / 14 / 13</small>
          </button>
          <div class="iv-controls" id="ivControls" hidden>
            <label class="iv-control">
              <span>Attack</span>
              <span class="iv-bar">
                <input type="range" min="0" max="15" step="1" value="14" data-iv-stat="attack">
              </span>
              <output data-iv-output="attack">14</output>
            </label>
            <label class="iv-control">
              <span>Defense</span>
              <span class="iv-bar">
                <input type="range" min="0" max="15" step="1" value="14" data-iv-stat="defense">
              </span>
              <output data-iv-output="defense">14</output>
            </label>
            <label class="iv-control">
              <span>Stamina</span>
              <span class="iv-bar">
                <input type="range" min="0" max="15" step="1" value="13" data-iv-stat="stamina">
              </span>
              <output data-iv-output="stamina">13</output>
            </label>
          </div>
        </div>

        <fieldset class="chance-mode" aria-label="Chance range">
          <label>
            <input type="radio" name="chanceMode" value="higher" checked>
            <span>or higher</span>
          </label>
          <label>
            <input type="radio" name="chanceMode" value="exact">
            <span>exactly</span>
          </label>
          <label>
            <input type="radio" name="chanceMode" value="lower">
            <span>or lower</span>
          </label>
        </fieldset>

        <div class="chance" aria-live="polite">
          <span class="chance-title">Chance of 91% or higher</span>
          <div class="reference-row" id="referenceRow" hidden></div>
          <div class="chance-list" id="chanceList"></div>
        </div>

        <fieldset class="floor-options" aria-label="IV floor overlays">
          <legend>IV floors</legend>
          <label class="floor-option" style="--series-color: #d39b1f;">
            <input type="checkbox" value="weather" data-floor-toggle>
            <span class="floor-swatch" aria-hidden="true"></span>
            <span>Weather boost</span>
            <small>4/4/4</small>
          </label>
          <label class="floor-option" style="--series-color: #416fbd;">
            <input type="checkbox" value="raid" data-floor-toggle>
            <span class="floor-swatch" aria-hidden="true"></span>
            <span>Raid</span>
            <small>10/10/10</small>
          </label>
          <label class="floor-option" style="--series-color: #7055a8;">
            <input type="checkbox" value="shadowRaid" data-floor-toggle>
            <span class="floor-swatch" aria-hidden="true"></span>
            <span>Shadow Raid</span>
            <small>6/6/6</small>
          </label>
          <label class="floor-option" style="--series-color: #e87516;">
            <input type="checkbox" value="mighty" data-floor-toggle>
            <span class="floor-swatch" aria-hidden="true"></span>
            <span>Mighty</span>
            <small>13/13/13</small>
          </label>
          <div class="trade-group">
            <button class="trade-toggle" id="tradeToggle" type="button" aria-expanded="false" aria-controls="tradeFloorList">
              <span class="trade-indicator" id="tradeIndicator" aria-hidden="true">▸</span>
              <span>Trade</span>
              <small>5 floors</small>
            </button>
            <div class="trade-floor-list" id="tradeFloorList" hidden>
              <label class="floor-option" style="--series-color: #b14c8f;">
                <input type="checkbox" value="lucky" data-floor-toggle>
                <span class="floor-swatch" aria-hidden="true"></span>
                <span>Lucky</span>
                <small>12/12/12</small>
              </label>
              <label class="floor-option" style="--series-color: #487a6f;">
                <input type="checkbox" value="goodFriend" data-floor-toggle>
                <span class="floor-swatch" aria-hidden="true"></span>
                <span>Good friend</span>
                <small>1/1/1</small>
              </label>
              <label class="floor-option" style="--series-color: #6b8b3e;">
                <input type="checkbox" value="greatFriend" data-floor-toggle>
                <span class="floor-swatch" aria-hidden="true"></span>
                <span>Great friend</span>
                <small>2/2/2</small>
              </label>
              <label class="floor-option" style="--series-color: #b67633;">
                <input type="checkbox" value="ultraFriend" data-floor-toggle>
                <span class="floor-swatch" aria-hidden="true"></span>
                <span>Ultra friend</span>
                <small>3/3/3</small>
              </label>
              <label class="floor-option" style="--series-color: #a85f70;">
                <input type="checkbox" value="bestFriend" data-floor-toggle>
                <span class="floor-swatch" aria-hidden="true"></span>
                <span>Best friend</span>
                <small>4/4/4</small>
              </label>
            </div>
          </div>
        </fieldset>

        <fieldset class="shiny-options" id="shinyOptions" aria-label="Shiny odds">
          <legend>Shiny</legend>
          <label class="shiny-toggle">
            <input id="shinyEnabled" type="checkbox">
            <span>Display shiny chance</span>
          </label>
          <label class="shiny-rate" id="wildRateControl">
            <span>Shiny encounter rate</span>
            <span class="rate-slider">
              <span>1/512</span>
              <input id="wildRateSlider" type="range" min="0" max="5" step="1" value="0" list="wildRateTicks">
              <span>1/25</span>
            </span>
            <datalist id="wildRateTicks">
              <option value="0"></option>
              <option value="1"></option>
              <option value="2"></option>
              <option value="3"></option>
              <option value="4"></option>
              <option value="5"></option>
            </datalist>
          </label>
          <label class="raid-boost" id="raidBoostControl">
            <input id="raidBoosted" type="checkbox">
            <span>Raid shiny boosted</span>
          </label>
          <span class="shiny-current" id="shinyRateOutput">Off</span>
        </fieldset>
      </section>

      <section class="attempts-panel" id="attemptsPanel" aria-label="Pinned chance across multiple attempts">
        <h2>Attempts</h2>
        <p class="attempts-basis" id="attemptsBasis">Pin a chance to compute</p>
        <div class="attempts-list" id="attemptsList" hidden>
          <label class="attempts-row">
            <span>Chance after</span>
            <input id="attemptsInput" type="number" min="1" max="1000000" step="1" value="100" inputmode="numeric">
            <span>attempts</span>
            <output id="attemptsChanceOutput">0%</output>
          </label>
          <label class="attempts-row">
            <span>Attempts for</span>
            <input id="targetChanceInput" type="number" min="0" max="100" step="1" value="50" inputmode="decimal">
            <span>% chance</span>
            <output id="requiredAttemptsOutput">0 attempts</output>
          </label>
        </div>
      </section>

      <footer class="site-footer">
        <span>App created by <a href="/">Toni Mattis</a> with OpenAI Codex</span>
        <a class="github-link" href="https://github.com/amintos/pogo-iv" aria-label="Code and issues on GitHub">
          <svg class="github-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M8 0C3.58 0 0 3.64 0 8.13c0 3.59 2.29 6.63 5.47 7.71.4.07.55-.18.55-.39 0-.19-.01-.83-.01-1.5-2.01.38-2.53-.5-2.69-.96-.09-.24-.48-.96-.82-1.15-.28-.15-.68-.52-.01-.53.63-.01 1.08.59 1.23.83.72 1.23 1.87.88 2.33.67.07-.53.28-.88.51-1.08-1.78-.21-3.64-.91-3.64-4.02 0-.89.31-1.62.82-2.19-.08-.21-.36-1.04.08-2.16 0 0 .67-.22 2.2.84A7.4 7.4 0 0 1 8 3.93c.68 0 1.36.09 2 .27 1.53-1.06 2.2-.84 2.2-.84.44 1.12.16 1.95.08 2.16.51.57.82 1.3.82 2.19 0 3.12-1.87 3.81-3.65 4.02.29.25.54.75.54 1.52 0 1.1-.01 1.99-.01 2.26 0 .21.15.47.55.39A8.03 8.03 0 0 0 16 8.13C16 3.64 12.42 0 8 0Z"></path>
          </svg>
          <span>Code and issues</span>
        </a>
      </footer>

    </main>
  </body>
</html>
